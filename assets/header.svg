<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f1a"/>
    <stop offset="0.55" stop-color="#151a33"/>
    <stop offset="1" stop-color="#0d1f2a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c5cff"/>
    <stop offset="0.5" stop-color="#3f8cff"/>
    <stop offset="1" stop-color="#4fd1c5"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.07"/>
  </pattern>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="card"><rect width="1200" height="260" rx="22"/></clipPath></defs>
  <style>@font-face{font-family:'SG700';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'SG500';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
  .edge{stroke:#4fd1c5;stroke-opacity:.14;stroke-width:1.2}
  .node{fill:#0b0f1a;stroke:#4fd1c5;stroke-opacity:.45;stroke-width:1.5}
  .pulse{fill:#4fd1c5;opacity:.85}

  .name{font-family:'SG700',sans-serif;font-size:84px;fill:#f5f7ff;letter-spacing:-1.5px}
  .tag{font-family:'SG500',sans-serif;font-size:19px;fill:#4fd1c5;letter-spacing:5px}
  .rise{opacity:0;animation:rise 1s ease-out forwards}
  .d2{animation-delay:.35s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  </style>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="22" fill="url(#dots)"/>
  <g clip-path="url(#card)"><circle cx="300" cy="50" r="130" fill="#7c5cff" opacity=".22" filter="url(#blur)"/>
  <circle cx="950" cy="220" r="140" fill="#4fd1c5" opacity=".16" filter="url(#blur)"/></g>
  <g>
    <line x1="90" y1="50" x2="230" y2="145" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" path="M90,50 L230,145"/></circle>
    <line x1="230" y1="145" x2="380" y2="65" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="4s" begin="0.6s" repeatCount="indefinite" path="M230,145 L380,65"/></circle>
    <line x1="230" y1="145" x2="180" y2="210" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="5s" begin="1.2s" repeatCount="indefinite" path="M230,145 L180,210"/></circle>
    <line x1="90" y1="50" x2="60" y2="175" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="6s" begin="1.7999999999999998s" repeatCount="indefinite" path="M90,50 L60,175"/></circle>
    <line x1="60" y1="175" x2="180" y2="210" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="3s" begin="2.4s" repeatCount="indefinite" path="M60,175 L180,210"/></circle>
    <line x1="1020" y1="55" x2="1140" y2="160" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="4s" begin="3.0s" repeatCount="indefinite" path="M1020,55 L1140,160"/></circle>
    <line x1="1140" y1="160" x2="1010" y2="230" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="5s" begin="3.5999999999999996s" repeatCount="indefinite" path="M1140,160 L1010,230"/></circle>
    <line x1="1140" y1="160" x2="1150" y2="235" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="6s" begin="4.2s" repeatCount="indefinite" path="M1140,160 L1150,235"/></circle>
    <line x1="1010" y1="230" x2="1150" y2="235" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="3s" begin="4.8s" repeatCount="indefinite" path="M1010,230 L1150,235"/></circle>
    <line x1="1020" y1="55" x2="760" y2="35" class="edge"/>
    <circle r="2.6" class="pulse"><animateMotion dur="4s" begin="5.3999999999999995s" repeatCount="indefinite" path="M1020,55 L760,35"/></circle>
    <circle cx="90" cy="50" r="4.5" class="node"/>
    <circle cx="230" cy="145" r="4.5" class="node"/>
    <circle cx="380" cy="65" r="4.5" class="node"/>
    <circle cx="180" cy="210" r="4.5" class="node"/>
    <circle cx="1020" cy="55" r="4.5" class="node"/>
    <circle cx="1140" cy="160" r="4.5" class="node"/>
    <circle cx="1010" cy="230" r="4.5" class="node"/>
    <circle cx="1150" cy="235" r="4.5" class="node"/>
    <circle cx="60" cy="175" r="4.5" class="node"/>
    <circle cx="760" cy="35" r="4.5" class="node"/>
  </g>
  <g class="rise"><text x="600" y="135" text-anchor="middle" class="name">Abhinav Gonthina</text></g>
  <rect x="420" y="160" width="360" height="3" rx="1.5" fill="url(#accent)"/>
  <rect x="420" y="159" width="90" height="5" rx="2.5" fill="url(#sheen)" opacity=".8">
    <animate attributeName="x" values="420;690" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <g class="rise d2"><text x="600" y="205" text-anchor="middle" class="tag">NORTHEASTERN CS  ·  4.0 GPA  ·  HONORS</text></g>
  <rect x="1" y="1" width="1198" height="258" rx="21" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>
</svg>
