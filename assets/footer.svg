<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110">
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f1a"/>
    <stop offset="0.55" stop-color="#151a33"/>
    <stop offset="1" stop-color="#0d1f2a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c5cff"/>
    <stop offset="0.5" stop-color="#3f8cff"/>
    <stop offset="1" stop-color="#4fd1c5"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.07"/>
  </pattern>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60"/></filter>
</defs>
  <style>@font-face{font-family:'SG500';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
  .edge{stroke:#4fd1c5;stroke-opacity:.14;stroke-width:1.2}
  .node{fill:#0b0f1a;stroke:#4fd1c5;stroke-opacity:.45;stroke-width:1.5}
  .pulse{fill:#4fd1c5;opacity:.85}

  .foot{font-family:'SG500',sans-serif;font-size:15px;fill:#9aa4c7;letter-spacing:6px}
  </style>
  <rect width="1200" height="110" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="110" rx="18" fill="url(#dots)"/>
  <line x1="80" y1="55" x2="420" y2="55" class="edge" stroke-opacity=".3"/>
  <line x1="780" y1="55" x2="1120" y2="55" class="edge" stroke-opacity=".3"/>
  <circle cx="80" cy="55" r="4.5" class="node"/><circle cx="420" cy="55" r="4.5" class="node"/>
  <circle cx="780" cy="55" r="4.5" class="node"/><circle cx="1120" cy="55" r="4.5" class="node"/>
  <circle r="2.6" class="pulse"><animateMotion dur="3s" repeatCount="indefinite" path="M80,55 L420,55"/></circle>
  <circle r="2.6" class="pulse"><animateMotion dur="3s" repeatCount="indefinite" path="M1120,55 L780,55"/></circle>
  <text x="600" y="60" text-anchor="middle" class="foot">THANKS FOR STOPPING BY</text>
  <rect x="1" y="1" width="1198" height="108" rx="17" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>
</svg>
